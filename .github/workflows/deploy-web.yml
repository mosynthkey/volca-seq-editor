name: Deploy web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run verify

      - run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GITHUB_TOKEN cannot create a Pages site; enablement must be done once in Settings.
      - name: Check GitHub Pages
        id: pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/pages" --jq .status

      - name: Deploy
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Pages setup required
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo '## GitHub Pages is not enabled'
            echo ''
            echo 'Open [Settings → Pages](https://github.com/'"${{ github.repository }}"'/settings/pages),'
            echo 'set **Build and deployment → Source** to **GitHub Actions**, then re-run this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::warning::GitHub Pages is not enabled. Set Source to GitHub Actions in repo Settings → Pages, then re-run.'
